<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tactics Recorder - Ghost Path v5</title>
    <style>
        :root { --line-color: rgba(255, 255, 255, 0.9); --accent-blue: #007AFF; --accent-red: #d63031; --accent-purple: #6c5ce7; --accent-orange: #e67e22; --accent-green: #27ae60; }
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; background-color: #1a1a1a; }
        body { font-family: 'Pretendard', sans-serif; display: flex; flex-direction: column; touch-action: none; }

        #field-container { flex: 1; display: flex; justify-content: center; align-items: center; background: #2c2c2c; padding: 5px; position: relative; overflow: hidden; box-sizing: border-box; }
        #pitch { position: relative; width: 100%; max-width: 450px; height: 100%; aspect-ratio: 450 / 750; background: #43A047; background-image: repeating-linear-gradient(#4CAF50, #4CAF50 10%, #43A047 10%, #43A047 20%); border: 3px solid var(--line-color); box-sizing: border-box; }

        /* 잔상용 캔버스 스타일 */
        #path-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }

        #controls { background: #222; color: white; padding: 10px; display: flex; flex-direction: column; gap: 6px; z-index: 100; border-top: 2px solid #444; box-sizing: border-box; }
        .tactic-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
        .zoom-controls { display: flex; align-items: center; justify-content: center; gap: 15px; background: #333; padding: 4px; border-radius: 8px; }
        
        button { padding: 10px 2px; cursor: pointer; border: none; border-radius: 6px; background: #333; color: white; font-weight: bold; font-size: 12px; transition: 0.2s; -webkit-tap-highlight-color: transparent; }
        button:disabled { opacity: 0.3; cursor: not-allowed; filter: grayscale(1); }
        button.active { background: var(--accent-blue); box-shadow: 0 0 8px rgba(0,122,255,0.4); }
        
        .rec-btn { background: var(--accent-red); }
        .rec-btn.recording { animation: blink 1s infinite; background: #ff4757; }
        .rec-btn.paused { background: var(--accent-orange); animation: none; }
        .save-btn { background: var(--accent-green); }
        .play-btn { background: var(--accent-purple); }
        .play-btn.paused { background: var(--accent-orange); }
        
        .formation-scroll { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0; scrollbar-width: none; }
        .formation-scroll::-webkit-scrollbar { display: none; }
        .form-btn { flex: 0 0 auto; padding: 8px 15px; min-width: 65px; background: #444; }

        #play-status { font-size: 10px; font-weight: normal; margin-left: 5px; color: #ffeb3b; }
        @keyframes blink { 50% { opacity: 0.6; } }

        .storage-list { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 8px; scrollbar-width: none; }
        .storage-item { flex: 0 0 auto; display: flex; align-items: center; background: #333; padding: 6px 12px; border-radius: 20px; font-size: 11px; border: 1px solid #444; }
        .storage-item.selected { border-color: var(--accent-blue); background: #1e3a5f; }
        .delete-btn { background: rgba(192, 57, 43, 0.8); width: 16px; height: 16px; border-radius: 50%; margin-left: 8px; font-size: 10px; border: none; color: white; }

        .line { position: absolute; border: 2px solid var(--line-color); box-sizing: border-box; pointer-events: none; }
        .half-line { top: 50%; width: 100%; border-top: 2px solid var(--line-color); transform: translateY(-50%); z-index: 1; }
        .center-circle { top: 50%; left: 50%; width: 22%; aspect-ratio: 1; border-radius: 50%; transform: translate(-50%, -50%); }
        .center-spot { top: 50%; left: 50%; width: 6px; height: 6px; background: var(--line-color); border-radius: 50%; transform: translate(-50%, -50%); z-index: 2; }
        .penalty-area { left: 50%; width: 58%; height: 16%; transform: translateX(-50%); }
        .penalty-area.top { top: 0; border-top: none; }
        .penalty-area.bottom { bottom: 0; border-bottom: none; }
        .goal-area { left: 50%; width: 26%; height: 6%; transform: translateX(-50%); }
        .goal-area.top { top: 0; border-top: none; }
        .goal-area.bottom { bottom: 0; border-bottom: none; }
        .penalty-arc { left: 50%; width: 22%; aspect-ratio: 1; border-radius: 50%; transform: translateX(-50%); }
        .penalty-arc.top { top: 16%; transform: translate(-50%, -50%); clip-path: inset(50% 0 0 0); }
        .penalty-arc.bottom { bottom: 16%; transform: translate(-50%, 50%); clip-path: inset(0 0 50% 0); }

        .player, .ball { position: absolute; border-radius: 50%; cursor: grab; display: flex; align-items: center; justify-content: center; font-weight: bold; user-select: none; z-index: 10; transform: translate(-50%, -50%) scale(1); transition: transform 0.2s ease, left 0.1s linear, top 0.1s linear; }
        .player { width: 8.5%; aspect-ratio: 1; border: 2px solid white; color: white; font-size: 11px; box-shadow: 0 4px 8px rgba(0,0,0,0.4); }
        .team-top { background: var(--accent-red); }
        .team-bottom { background: #0984e3; }
        .ball { width: 6%; aspect-ratio: 1; background: white; border: 1px solid #333; z-index: 20; background-image: radial-gradient(circle at 30% 30%, #fff, #ccc); }
    </style>
</head>
<body>

<div id="field-container">
    <div id="pitch">
        <canvas id="path-canvas"></canvas>
        
        <div class="line half-line"></div>
        <div class="line center-circle"></div>
        <div class="center-spot"></div>
        <div class="line penalty-area top"></div>
        <div class="line goal-area top"></div>
        <div class="line penalty-arc top"></div>
        <div class="line penalty-area bottom"></div>
        <div class="line goal-area bottom"></div>
        <div class="line penalty-arc bottom"></div>
        <div id="ball" class="ball" data-id="ball" style="left: 50%; top: 50%;"></div>
    </div>
</div>

<div id="controls">
    <div class="zoom-controls">
        <button onclick="changeZoom(-0.1)" style="width:30px;">-</button>
        <span id="zoom-val" style="font-size: 11px;">선수 크기 100%</span>
        <button onclick="changeZoom(0.1)" style="width:30px;">+</button>
    </div>

    <div class="tactic-grid">
        <button id="btn-rec" class="rec-btn" onclick="handleRecordClick()">녹화 시작</button>
        <button id="btn-save" class="save-btn" onclick="saveTactics()">저장</button>
        <button id="btn-play" class="play-btn" onclick="handlePlayClick()" disabled>전술 시작 (선택 없음)</button>
    </div>

    <div class="tactic-grid">
        <button id="btn-top" class="team-sel-btn" onclick="selectTeam('top')">Red 팀</button>
        <button id="btn-bottom" class="team-sel-btn" onclick="selectTeam('bottom')">Blue 팀</button>
        <button style="background: var(--accent-orange);" onclick="resetAll()">초기화</button>
    </div>
    
    <div class="formation-scroll" id="formation-grid">
        <button class="form-btn" onclick="applyTactic('442')">4-4-2</button>
        <button class="form-btn" onclick="applyTactic('433')">4-3-3</button>
        <button class="form-btn" onclick="applyTactic('4231')">4-2-3-1</button>
        <button class="form-btn" onclick="applyTactic('4141')">4-1-4-1</button>
        <button class="form-btn" onclick="applyTactic('4123')">4-1-2-3</button>
        <button class="form-btn" onclick="applyTactic('541')">5-4-1</button>
        <button class="form-btn" onclick="applyTactic('424')">4-2-4</button>
    </div>

    <div class="storage-list" id="storage-list"></div>
</div>

<script>
    let currentActiveTeam = 'top';
    const players = { top: [], bottom: [] };
    const pitch = document.getElementById('pitch');
    const ball = document.getElementById('ball');
    const canvas = document.getElementById('path-canvas');
    const ctx = canvas.getContext('2d');
    
    let isRecording = false, isRecPaused = false, recStartTime = 0, recPausedTime = 0, totalPausedDuration = 0, currentRecording = [];
    let isPlaying = false, isPaused = false, playTimers = [], currentFrameIndex = 0, playbackTacticData = [];
    let selectedTacticKey = null, currentScale = 1.0;
    
    // 잔상 추적용 변수
    let lastPositions = {}; 

    const tactics = {
        '442': [[50,5],[18,16],[39,16],[61,16],[82,16],[18,31],[39,31],[61,31],[82,31],[35,44],[65,44]],
        '433': [[50,5],[18,16],[39,16],[61,16],[82,16],[27,29],[50,32],[73,29],[18,45],[50,47],[82,45]],
        '4231': [[50,5],[18,16],[38,16],[62,16],[82,16],[35,28],[65,28],[18,40],[50,40],[82,40],[50,48]],
        '4141': [[50,5],[18,16],[39,16],[61,16],[82,16],[50,25],[15,38],[38,38],[62,38],[85,38],[50,48]],
        '4123': [[50,5],[18,15],[39,15],[61,15],[82,15],[50,24],[33,35],[67,35],[18,46],[50,48],[82,46]],
        '541': [[50,5],[13,13],[32,15],[50,16],[68,15],[87,13],[18,29],[39,31],[61,31],[82,29],[50,45]],
        '424': [[50,5],[18,16],[39,16],[61,16],[82,16],[38,31],[62,31],[15,46],[38,48],[62,48],[85,46]]
    };

    function init() {
        resizeCanvas();
        createTeam('top'); createTeam('bottom'); selectTeam('bottom'); 
        makeDraggable(ball); renderStorageList();
        window.addEventListener('resize', resizeCanvas);
    }

    function resizeCanvas() {
        canvas.width = pitch.clientWidth;
        canvas.height = pitch.clientHeight;
    }

    function changeZoom(delta) {
        currentScale = Math.max(0.5, Math.min(2.0, currentScale + delta));
        [...players.top, ...players.bottom, ball].forEach(el => el.style.transform = `translate(-50%, -50%) scale(${currentScale})`);
        document.getElementById('zoom-val').innerText = `선수 크기 ${Math.round(currentScale * 100)}%`;
        recordFrame('ball', ball.style.left, ball.style.top);
    }

    function createTeam(team) {
        for(let i=0; i<11; i++) {
            const p = document.createElement('div');
            p.className = `player team-${team}`;
            p.dataset.id = `${team}-${i}`;
            p.innerText = i + 1;
            pitch.appendChild(p);
            players[team].push(p);
            makeDraggable(p); 
        }
        resetToBasic(team);
    }

    function selectTeam(team) {
        if (isPlaying) return;
        currentActiveTeam = team;
        document.getElementById('btn-top').classList.toggle('active', team === 'top');
        document.getElementById('btn-bottom').classList.toggle('active', team === 'bottom');
    }

    function resetToBasic(team) {
        const isTop = (team === 'top');
        players[team].forEach((p, i) => {
            p.style.transition = 'all 0.5s ease';
            p.style.left = `${(100/12) * (i+1)}%`;
            p.style.top = isTop ? '4%' : '96%';
            setTimeout(() => p.style.transition = '', 500);
        });
    }

    function applyTactic(tName) {
        if (isPlaying) return;
        const data = tactics[tName];
        const isTop = (currentActiveTeam === 'top');
        players[currentActiveTeam].forEach((p, i) => {
            p.style.transition = 'all 0.5s ease';
            const nl = `${data[i][0]}%`, nt = isTop ? `${data[i][1]}%` : `${100 - data[i][1]}%`;
            p.style.left = nl; p.style.top = nt;
            recordFrame(p.dataset.id, nl, nt);
            setTimeout(() => p.style.transition = '', 500);
        });
    }

    // --- 녹화 ---
    function handleRecordClick() {
        if (isPlaying) return;
        if (!isRecording) startRecording();
        else isRecPaused ? resumeRecording() : pauseRecording();
    }

    function startRecording() {
        isRecording = true; isRecPaused = false; currentRecording = [];
        recStartTime = Date.now(); totalPausedDuration = 0;
        const btn = document.getElementById('btn-rec');
        btn.innerText = "일시 정지"; btn.classList.add('recording');
        document.getElementById('btn-play').disabled = document.getElementById('btn-save').disabled = true;
        [...players.top, ...players.bottom, ball].forEach(el => recordFrame(el.dataset.id || 'ball', el.style.left, el.style.top));
    }

    function pauseRecording() {
        isRecPaused = true; recPausedTime = Date.now();
        const btn = document.getElementById('btn-rec');
        btn.innerText = "다시 시작"; btn.classList.replace('recording', 'paused');
        document.getElementById('btn-save').disabled = false;
    }

    function resumeRecording() {
        isRecPaused = false; totalPausedDuration += (Date.now() - recPausedTime);
        const btn = document.getElementById('btn-rec');
        btn.innerText = "일시 정지"; btn.classList.replace('paused', 'recording');
        document.getElementById('btn-save').disabled = true;
    }

    function recordFrame(id, x, y) {
        if (!isRecording || isRecPaused) return;
        currentRecording.push({ t: Date.now() - recStartTime - totalPausedDuration, id, x, y, s: currentScale });
    }

    function saveTactics() {
        if (currentRecording.length === 0) return;
        const name = prompt("전술 이름", `전술 ${new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}`);
        if (name) localStorage.setItem(`tactic_${Date.now()}`, JSON.stringify({ name, data: currentRecording }));
        resetAll();
    }

    // --- 재생 및 잔상 그리기 ---
    function handlePlayClick() {
        if (!selectedTacticKey || isRecording) return;
        if (!isPlaying) startPlayback(0);
        else isPaused ? resumePlayback() : pausePlayback();
    }

    function startPlayback(startIndex) {
        const item = JSON.parse(localStorage.getItem(selectedTacticKey));
        playbackTacticData = item.data;
        isPlaying = true; isPaused = false; currentFrameIndex = startIndex;
        lastPositions = {}; // 잔상 위치 초기화
        ctx.clearRect(0, 0, canvas.width, canvas.height); // 캔버스 청소
        setUIState(true);
        runPlaybackLoop();
    }

    function runPlaybackLoop() {
        if (isPaused || currentFrameIndex >= playbackTacticData.length) return;
        const baseTime = playbackTacticData[currentFrameIndex].t;

        for (let i = currentFrameIndex; i < playbackTacticData.length; i++) {
            const frame = playbackTacticData[i];
            const timerId = setTimeout(() => {
                const el = frame.id === 'ball' ? ball : document.querySelector(`[data-id="${frame.id}"]`);
                if (el) { 
                    // 잔상 그리기 로직
                    drawPath(frame.id, frame.x, frame.y);
                    
                    el.style.left = frame.x; el.style.top = frame.y;
                    el.style.transform = `translate(-50%, -50%) scale(${frame.s || 1})`;
                }
                currentFrameIndex = i;
                if (i === playbackTacticData.length - 1) finishPlayback();
            }, frame.t - baseTime);
            playTimers.push(timerId);
        }
        updatePlayUI(" [재생 중...]", "일시 정지");
    }

    function drawPath(id, xPercent, yPercent) {
        const x = (parseFloat(xPercent) / 100) * canvas.width;
        const y = (parseFloat(yPercent) / 100) * canvas.height;

        if (lastPositions[id]) {
            ctx.beginPath();
            ctx.moveTo(lastPositions[id].x, lastPositions[id].y);
            ctx.lineTo(x, y);
            
            // 팀별 잔상 색상 설정
            if (id === 'ball') {
                ctx.strokeStyle = "white";
                ctx.setLineDash([5, 5]); // 공은 점선
                ctx.lineWidth = 1.5;
            } else if (id.startsWith('top')) {
                ctx.strokeStyle = "rgba(214, 48, 49, 0.4)"; // Red팀 (투명도 조절)
                ctx.setLineDash([]);
                ctx.lineWidth = 2;
            } else {
                ctx.strokeStyle = "rgba(9, 132, 227, 0.4)"; // Blue팀
                ctx.setLineDash([]);
                ctx.lineWidth = 2;
            }
            ctx.stroke();
        }
        lastPositions[id] = { x, y };
    }

    function pausePlayback() {
        isPaused = true;
        playTimers.forEach(clearTimeout); playTimers = [];
        updatePlayUI(" [일시정지]", "다시 시작");
        document.getElementById('btn-play').classList.add('paused');
    }

    function resumePlayback() {
        isPaused = false;
        document.getElementById('btn-play').classList.remove('paused');
        runPlaybackLoop();
    }

    function finishPlayback() {
        isPlaying = false; setUIState(false);
        updatePlayUI(" [완료]", `시작: ${JSON.parse(localStorage.getItem(selectedTacticKey)).name}`);
    }

    function setUIState(disabled) {
        document.querySelectorAll('.team-sel-btn, .form-btn, #btn-rec, #btn-save').forEach(b => b.disabled = disabled);
    }

    function updatePlayUI(status, btnText) {
        document.getElementById('btn-play').innerHTML = `${btnText}<span id="play-status">${status}</span>`;
    }

    function resetAll() {
        playTimers.forEach(clearTimeout);
        isPlaying = isPaused = isRecording = isRecPaused = false;
        ctx.clearRect(0, 0, canvas.width, canvas.height); // 잔상 제거
        resetToBasic('top'); resetToBasic('bottom');
        ball.style.left = '50%'; ball.style.top = '50%';
        currentScale = 1.0; 
        [...players.top, ...players.bottom, ball].forEach(el => el.style.transform = `translate(-50%, -50%) scale(1)`);
        document.getElementById('btn-rec').innerText = "녹화 시작";
        document.getElementById('btn-rec').className = "rec-btn";
        document.getElementById('btn-play').innerText = "전술 시작 (선택 없음)";
        document.getElementById('btn-play').disabled = true;
        setUIState(false); renderStorageList();
    }

    function renderStorageList() {
        const list = document.getElementById('storage-list'); list.innerHTML = "";
        Object.keys(localStorage).filter(k => k.startsWith('tactic_')).sort().forEach(key => {
            const item = JSON.parse(localStorage.getItem(key));
            const div = document.createElement('div');
            div.className = `storage-item ${selectedTacticKey === key ? 'selected' : ''}`;
            div.onclick = () => { if(!isPlaying && !isRecording) selectTactic(key); };
            div.innerHTML = `<span>${item.name}</span><button class="delete-btn" onclick="event.stopPropagation(); deleteTactic('${key}')">×</button>`;
            list.appendChild(div);
        });
    }

    function selectTactic(key) {
        selectedTacticKey = key;
        const item = JSON.parse(localStorage.getItem(key));
        updatePlayUI("", `시작: ${item.name}`);
        document.getElementById('btn-play').disabled = false;
        renderStorageList();
    }

    function deleteTactic(key) {
        if(confirm("삭제할까요?")) { localStorage.removeItem(key); resetAll(); }
    }

    function makeDraggable(el) {
        let dragging = false;
        const move = (e) => {
            if (!dragging || isPlaying || isRecPaused) return;
            const rect = pitch.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const px = Math.max(0, Math.min(((clientX - rect.left) / rect.width) * 100, 100)) + '%';
            const py = Math.max(0, Math.min(((clientY - rect.top) / rect.height) * 100, 100)) + '%';
            el.style.left = px; el.style.top = py;
            recordFrame(el.dataset.id || 'ball', px, py);
        };
        el.addEventListener('mousedown', () => { if(!isPlaying) dragging = true; });
        window.addEventListener('mousemove', move);
        window.addEventListener('mouseup', () => dragging = false);
        el.addEventListener('touchstart', () => { if(!isPlaying) dragging = true; });
        window.addEventListener('touchmove', (e) => { if(dragging) e.preventDefault(); move(e); }, { passive: false });
        window.addEventListener('touchend', () => dragging = false);
    }
    init();
</script>
</body>
</html>
